name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Django
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: totanga
          POSTGRES_USER: totanga
          POSTGRES_PASSWORD: totanga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U totanga -d totanga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      POSTGRES_DB: totanga
      POSTGRES_USER: totanga
      POSTGRES_PASSWORD: totanga
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Extensions PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=totanga psql -h 127.0.0.1 -U totanga -d totanga -c "CREATE EXTENSION IF NOT EXISTS unaccent;"
          PGPASSWORD=totanga psql -h 127.0.0.1 -U totanga -d totanga -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Contrôle Django
        run: python manage.py check

      - name: Migrations
        run: python manage.py migrate --noinput

      - name: Tests
        run: python manage.py test apps --exclude-tag=real_repertoire -v 1

  frontend:
    name: Site public React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build production
        run: npm run build
        env:
          VITE_USE_FIXTURES: "false"

  admin:
    name: Administration React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Installer
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build production
        run: npm run build
