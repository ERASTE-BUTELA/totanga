# À coller dans le Nginx HÔTE (bibtotanga.com), AVANT le location / du site public.
# Conservez le slash final sur proxy_pass (8081/).
#
# Sur location /api/ du même server, ajoutez aussi :
#   client_max_body_size 12m;
# (sinon l'enregistrement d'un livre avec couverture renvoie 413 → message générique).
#
# Sur location /media/, proxy vers le frontend (8080), PAS vers Django (8000) :
#   proxy_pass http://127.0.0.1:8080;
# (en production Django ne sert pas les fichiers media → couvertures en 404).
#
# Diagnostic après reload :
#   curl -sI https://bibtotanga.com/admin/ | findstr /I X-Totanga-App
#   curl -sI https://bibtotanga.com/admin/catalogue/livres | findstr /I X-Totanga-App
#   curl -sI https://bibtotanga.com/ | findstr /I X-Totanga-App
# Attendu : admin, admin, public.
# Si l'en-tête est « public » sur une URL /admin/…, le F5 tombe encore sur 8080.

location = /admin {
    return 301 /admin/;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Totanga-App "admin" always;
}

